services:
  - type: web
    name: solana-meme-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_RPC_FALLBACK_URL
        sync: false
      - key: MADEONSOL_API_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: DEFAULT_SCAN_MODE
        value: medium
      - key: SCAN_INTERVAL_SECONDS
        value: "30"
      - key: TRACKING_WINDOW_HOURS
        value: "24"
      - key: RPC_DAILY_REQUEST_BUDGET
        value: "2000"
      - key: RPC_MIN_GAP_SECONDS
        value: "1.0"
      - key: DEAD_TOKEN_MINUTES
        value: "60"
      - key: DEAD_DELETE_HOURS
        value: "24"
